# reBot-DM real-hardware experiment configuration.
# Safe by default: this file cannot create a real hardware session or motion.

sdk_root: ""
host: "127.0.0.1"
tcp_port: 5000
udp_port: 5001

control_mode: state_only        # state_only | servo_hold | excitation
control_rate_hz: 200.0
duration_s: 0.1
max_samples: 5
output_csv: data/rebot_real/hardware_experiment.csv

allow_hardware: false
allow_motion: false

# Hardware mapping is intentionally unresolved. Do not change these gates based on
# simulation/model assumptions; fill them only after real-joint convention verification.
joint_mapping_verified: false
j1_convention: UNRESOLVED
joint_direction: [1, 1, 1, 1, 1, 1]
joint_offset_rad: [0, 0, 0, 0, 0, 0]

# Canonical model limits are placeholders for the upper fail-fast gate. J1 conflicts
# with the current SDK [0, 2*pi] deployment limit and therefore remains unresolved.
# joint_position_min_rad: [-2.8, -3.14, -3.14, -1.87, -1.57, -3.14]
# joint_position_max_rad: [2.8, 0.0, 0.0, 1.57, 1.57, 3.14]
joint_position_min_rad: [0.0, -3.14, -3.14, -1.87, -1.57, -3.14]
joint_position_max_rad: [6.283185307180, 0.0, 0.0, 1.57, 1.57, 3.14]
maximum_command_velocity_rad_s: [0.05, 0.05, 0.05, 0.05, 0.05, 0.05]
# Independent target-to-feedback lag gate. 10 mrad is above the 2.452 mrad
# maximum observed before the A_run02 false velocity rejection, while remaining
# below lower safety.json measured_position_tolerance_rad=17.453293 mrad.
maximum_tracking_error_rad: [0.01, 0.01, 0.01, 0.01, 0.01, 0.01]
maximum_servo_target_delta_rad: 0.003125

# SDK MoveJ preposition parameters. These are not identification excitation limits.
# Current values mirror wlsea_arm_sdk.movej_runtime; official identification-grade
# acceleration/jerk limits remain PENDING and do not become certified by this file.
movej_max_velocity_rad_s: [0.3141592653589793, 0.2792526803190927, 0.2617993877991494, 0.3141592653589793, 0.2617993877991494, 0.2617993877991494]
movej_max_acceleration_rad_s2: [0.6979571678725324, 0.5583308277129860, 0.6979571678725324, 0.8375835080320788, 0.8375835080320788, 1.0470230182713984]
movej_max_jerk_rad_s3: [10.471975511965978, 10.471975511965978, 10.471975511965978, 10.471975511965978, 10.471975511965978, 10.471975511965978]
movej_timeout_s: 60.0
# Post-run MoveJ park is opt-in. Historical modes keep direct disable behavior.
controlled_park_before_disable: false
start_position_tolerance_rad: 0.01
preposition_settle_velocity_tolerance_rad_s: 0.01

maximum_feedback_age_ms: 100.0
# Optional disabled/pre-enable limit. null preserves the historical single-limit behavior.
maximum_disabled_feedback_age_ms: null

connect_timeout_s: 3.0
command_timeout_s: 3.0
state_timeout_s: 0.25

# The trusted reBot Fourier implementation currently lives in C++ ForceController.
# Offline Phase 6B intentionally does not duplicate that math in Python.
trajectory_source: pending_cxx_fourier_integration
trajectory_hash: null
